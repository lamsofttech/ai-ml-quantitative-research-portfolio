name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_catalog.py
      - run: python -O scripts/validate_catalog.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m ruff check scripts

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
        project: [projects/01-numerical-methods, projects/02-monte-carlo-option-pricing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install independent project environment
        run: python -m pip install -e "${{ matrix.project }}[dev]" -r requirements-dev.txt
      - name: Lint project
        run: python -m ruff check "${{ matrix.project }}"
      - name: Test project
        run: python -m pytest "${{ matrix.project }}/tests"

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context: ['.', 'projects/02-monte-carlo-option-pricing']
    steps:
      - uses: actions/checkout@v4
      - name: Build container without publishing
        run: docker build --tag portfolio-validation:local "${{ matrix.context }}"
