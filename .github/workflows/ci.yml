name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/01-numerical-methods/pyproject.toml
      - run: python -m pip install -e "projects/01-numerical-methods[dev]" -r requirements-dev.txt
      - run: ruff check projects/01-numerical-methods scripts
      - run: pytest projects/01-numerical-methods/tests
      - run: python scripts/validate_catalog.py

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript projects/01-numerical-methods/r/lagrange_interpolation.R

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-ml-quantitative-research-portfolio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

