name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_catalog.py
      - run: ruff check scripts

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        project:
          - projects/01-numerical-methods
          - projects/02-monte-carlo-option-pricing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml
      - run: python -m pip install -e "${{ matrix.project }}[dev]"
      - run: ruff check ${{ matrix.project }}
      - run: pytest ${{ matrix.project }}/tests

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript projects/01-numerical-methods/r/lagrange_interpolation.R

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            tag: ai-ml-quantitative-research-portfolio:test
          - context: projects/02-monte-carlo-option-pricing
            tag: mc-option-pricing:test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

