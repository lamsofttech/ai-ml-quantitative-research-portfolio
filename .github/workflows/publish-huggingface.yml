name: Publish portfolio hub to Hugging Face
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'spaces/portfolio-hub/**'
      - 'scripts/publish_huggingface.py'
      - '.github/workflows/publish-huggingface.yml'
permissions:
  contents: read
concurrency:
  group: huggingface-portfolio-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check deployment credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add the HF_TOKEN repository Actions secret with write access to the portfolio Space."
            exit 1
          fi
      - name: Install project validation tools
        run: |
          python -m pip install -e "projects/01-numerical-methods[dev]" -e "projects/02-monte-carlo-option-pricing[dev]" "huggingface_hub>=0.36,<2"
      - name: Validate project packages and Space syntax
        run: |
          python -m pytest projects/01-numerical-methods/tests projects/02-monte-carlo-option-pricing/tests
          python -m compileall -q spaces/portfolio-hub scripts/publish_huggingface.py
      - name: Publish Space source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_huggingface.py
