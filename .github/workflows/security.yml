name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.9.4
      - name: Scan production Python for medium and high severity issues
        run: >-
          python -m bandit -r
          projects/01-numerical-methods/src
          projects/02-monte-carlo-option-pricing/src
          projects/01-numerical-methods/app.py
          projects/02-monte-carlo-option-pricing/app
          spaces/portfolio-hub scripts
          --severity-level medium
