[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-mc-option-pricing"
version = "0.1.0"
description = "Vectorized Monte Carlo option pricing, Black-Scholes comparison, and risk analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8,<4"]
app = ["streamlit>=1.38,<2", "pandas>=2.1,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
