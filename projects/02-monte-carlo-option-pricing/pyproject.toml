[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-mc-option-pricing"
version = "0.1.0"
description = "Vectorized Monte Carlo option pricing, Black-Scholes comparison, and risk analysis"
# 3.10, not 3.11 (unlike the other projects), because this package is installed
# straight from GitHub by the Hugging Face Space in spaces/portfolio-hub, whose
# build image runs Python 3.10.13. The code has no 3.11+-only syntax.
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8,<4"]
app = ["streamlit>=1.38,<2", "pandas>=2.1,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
