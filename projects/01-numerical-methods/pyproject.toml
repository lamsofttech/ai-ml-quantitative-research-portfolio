[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-numerical-methods"
version = "0.1.0"
description = "Reproducible numerical methods for quantitative research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

